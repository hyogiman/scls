<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>질문 화면 · 강사용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root{
    --bg:#141821;
    --card:#1D2330;
    --card2:#232A39;
    --line:#2E3646;
    --ink:#EEF0F3;
    --muted:#8D96A8;
    --badge:#F2C14E;      /* 명찰 색 — 이 화면의 유일한 강조색 */
    --ok:#5FBF9B;
    --qs:1;               /* 질문 글자 배율 (A- / A+ 로 조절) */
    --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;
    --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ── 상단 바 ── */
  header{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:20px;padding:18px 26px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#181D28,#141821);
  }
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .live{width:9px;height:9px;border-radius:50%;background:#4A5468;flex:0 0 auto}
  .live.off{background:#C05B4A!important;animation:none!important}
  .live.on{background:var(--ok);box-shadow:0 0 0 0 rgba(95,191,155,.55);animation:pulse 2.4s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 12px rgba(95,191,155,0)}100%{box-shadow:0 0 0 0 rgba(95,191,155,0)}}
  .brand h1{font-size:31px;font-weight:800;letter-spacing:-.03em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--dim,#5D6779);text-transform:uppercase;display:block;margin-bottom:5px}

  /* 숫자 상자 — 글자 크기를 바꿔도 흔들리지 않도록 고정 치수로 둔다.
     자릿수가 늘어도 폭이 안 튀게 min-width와 등폭 숫자를 쓴다. */
  /* 상자 두 개를 따로 두면 글꼴·자릿수에 따라 서로 다르게 보인다.
     한 틀 안에 칸을 나눠 두 칸의 치수를 못 어긋나게 못박는다. */
  .meters{display:flex;align-items:center;gap:12px;flex:0 0 auto}
  .gauge{display:flex;align-items:stretch;flex:0 0 auto;
    background:#1B2029;border:1px solid #2B3242;border-radius:10px;overflow:hidden}
  .cell{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;
    height:46px;padding:0 17px;min-width:116px;box-sizing:border-box}
  .cell + .cell{border-left:1px solid #2B3242}
  .cell span{flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.02em}
  .cell b{flex:0 0 auto;font-family:var(--mono);font-size:22px;font-weight:600;line-height:1;
    font-variant-numeric:tabular-nums}
  .cell.q{background:#231F16}
  .cell.q b{color:var(--badge)}

  .zoom{display:flex;gap:6px;margin-left:6px}
  .zoom button{
    width:38px;height:34px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:8px;font-family:var(--mono);font-size:13px;cursor:pointer;transition:.15s;
  }
  .zoom button:hover{color:var(--ink);border-color:#3E4A5E}
  .zoom button:focus-visible{outline:2px solid var(--badge);outline-offset:2px}

  /* ── 질문 보드 ── */
  main{flex:1 1 auto;overflow-y:auto;padding:32px 26px 60px}
  /* 질문은 한 칸으로 세로로만 쌓는다. 가로로 너무 길면 읽기 힘드니 폭을 묶고 가운데 정렬 */
  #board{display:flex;flex-direction:column;gap:calc(28px * var(--qs));max-width:1150px;margin:0 auto;width:100%}

  /* 질문 한 건 = 명찰을 꽂아 둔 종이 한 장.
     색은 테두리 선이 아니라 명찰 전체를 채운다 — 면적이 커야 뒷줄에서 갈라진다.
     명찰이 종이 위로 걸쳐 있어야 하므로 overflow:hidden 금지. */
  .q{
    flex:0 0 auto;position:relative;background:var(--card);border-radius:3px;
    padding:calc(30px * var(--qs)) 24px 16px;
    animation:in .38s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

  .tag{
    position:absolute;top:calc(-13px * var(--qs));left:22px;
    background:var(--c,var(--badge));color:#161A22;
    padding:calc(7px * var(--qs)) 15px calc(7px * var(--qs)) 26px;border-radius:3px;
    display:inline-flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    max-width:calc(100% - 44px);box-shadow:0 8px 20px -8px rgba(0,0,0,.8);
  }
  .tag::before{                                   /* 명찰 구멍 */
    content:'';position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.34);
  }
  .tag .nm{font-size:calc(17px * var(--qs));font-weight:800;letter-spacing:-.01em}
  .tag .aff{font-size:calc(12px * var(--qs));font-weight:600;opacity:.68}
  .tag .aff:empty{display:none}

  .q p{font-size:calc(19px * var(--qs));line-height:1.62;white-space:pre-wrap;word-break:break-word}
  .q > time{display:block;text-align:right;margin-top:10px;font-family:var(--mono);font-size:11.5px;color:#5D6779}

  /* 문답모드 답안 — 답이 짧으므로 카드를 낮추고, 맞은 답에는 도장을 찍는다 */
  .q.ans{padding:calc(28px * var(--qs)) 20px 14px}
  .q.ans p{font-size:calc(25px * var(--qs));font-weight:700;padding-right:120px;letter-spacing:-.02em}
  .q.ans > time{display:none}
  .q.ans .mark{position:absolute;right:20px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:11px}
  .q.ans .mark .rk{font-family:var(--mono);font-size:calc(21px * var(--qs));font-weight:600}
  .q.ans .mark .st{width:calc(46px * var(--qs));height:calc(46px * var(--qs));border-radius:50%;
    display:grid;place-items:center;font-size:calc(23px * var(--qs));font-weight:800}
  .q.ans.ok{background:#16241E;box-shadow:inset 0 0 0 1px rgba(95,191,155,.4)}
  .q.ans.ok .mark .st{background:var(--ok);color:#0E1A16}
  .q.ans.ok .mark .rk{color:var(--ok)}
  .q.ans.no{background:#20242E;opacity:.78}
  .q.ans.no .mark .st{background:#333B49;color:#78828F}

  .q.fresh{box-shadow:0 0 0 2px var(--c,var(--badge)),0 14px 36px -16px rgba(0,0,0,.75)}
  .q.done{opacity:.45}
  .q.done .tag{background:#39414F;color:#AAB2C0;box-shadow:none}
  .q.done > time::before{content:'답변함 · ';color:var(--ok)}

  /* ── 빈 화면 / 안내 ── */
  #note{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:40px;pointer-events:none;
  }
  #note.show{display:flex}
  #note .big{font-size:24px;font-weight:600;color:#5B6578}
  #note .sub{font-size:15px;color:#48505F;line-height:1.8;white-space:pre-line}
  #note .fin{display:flex;gap:26px;margin-top:6px}
  #note .fin div{text-align:center}
  #note .fin b{display:block;font-family:var(--mono);font-size:30px;font-weight:600;color:var(--badge)}
  #note .fin span{font-size:12px;color:#5B6578}
  .wrap{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}

  /* 강사에게만 보내는 안내 — 강의 중에도 눈에 걸리도록 화면 맨 위를 차지한다.
     밝은 종이색에 짙은 글씨(대비 13.4:1)로 두어 어떤 모니터에서도 읽힌다. */
  #tnote{
    flex:0 0 auto;display:none;align-items:center;gap:18px;
    background:#F5D97A;border-top:5px solid #D9463A;
    padding:16px 26px;animation:drop .4s cubic-bezier(.2,.85,.3,1);
  }
  #tnote.on{display:flex}
  @keyframes drop{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
  #tnote .dot{flex:0 0 auto;width:13px;height:13px;border-radius:50%;background:#D9463A;
    animation:tpulse 1.6s ease-in-out infinite}
  @keyframes tpulse{50%{opacity:.25;transform:scale(.8)}}
  #tnote .body{min-width:0;flex:1}
  #tnote .lab{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.22em;
    color:#8A5A12;text-transform:uppercase;margin-bottom:5px;font-weight:600}
  #tnote p{font-size:calc(23px * var(--qs));font-weight:700;line-height:1.45;color:#241705;
    letter-spacing:-.02em;white-space:pre-line;word-break:break-word}

  /* 새 질문 알림 */
  #flash{
    position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-140%);
    background:var(--badge);color:#20242E;font-weight:700;font-size:17px;letter-spacing:-.01em;
    padding:13px 30px;border-radius:0 0 14px 14px;box-shadow:0 12px 34px -10px rgba(0,0,0,.55);
    transition:transform .34s cubic-bezier(.2,.85,.3,1);z-index:40;white-space:nowrap;
  }
  #flash.on{transform:translateX(-50%) translateY(0)}

  /* 돌발퀴즈 — 강사 전용 화면에만 뜨는 조작판 */
  #qzBtn{
    position:fixed;right:26px;bottom:24px;z-index:30;
    background:var(--badge);color:#20242E;font-weight:800;font-size:15px;
    border:none;border-radius:10px;padding:13px 20px;cursor:pointer;
    box-shadow:0 10px 26px -10px rgba(0,0,0,.8);
  }
  #qzBtn.live{background:#E0574A;color:#fff}
  #qzPanel{
    position:fixed;right:26px;bottom:78px;z-index:30;width:360px;max-width:calc(100vw - 52px);
    background:#1A1F2A;border:1px solid #2E3644;border-radius:12px;padding:18px;
    display:none;box-shadow:0 22px 50px -18px rgba(0,0,0,.9);
  }
  #qzPanel.on{display:block}
  #qzPanel h3{font-size:14px;font-weight:700;margin-bottom:4px}
  #qzPanel .d{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:13px}
  #qzPanel input[type=text]{width:100%;padding:12px 13px;background:#12161E;border:1px solid #2E3644;border-radius:9px;
    color:var(--ink);font-family:var(--sans);font-size:15px;outline:none}
  #qzPanel input[type=text]:focus{border-color:var(--badge)}
  .qzmode{display:flex;gap:7px;margin:11px 0 14px}
  .qzmode button{flex:1;padding:9px;border:1px solid #2E3644;background:transparent;color:var(--muted);
    border-radius:8px;font-size:12.5px;cursor:pointer;font-family:var(--sans)}
  .qzmode button.on{background:var(--badge);color:#20242E;border-color:var(--badge);font-weight:700}
  #qzGo{width:100%;padding:13px;border:none;border-radius:9px;background:var(--ok);color:#0E1A16;
    font-weight:800;font-size:15px;cursor:pointer;font-family:var(--sans)}
  #qzGo.stop{background:#E0574A;color:#fff}
  #qzHits{margin-top:14px;max-height:230px;overflow-y:auto}
  #qzHits .hd{font-size:11.5px;color:var(--muted);margin-bottom:9px;font-family:var(--mono);letter-spacing:.1em}
  #qzHits .hit{display:inline-flex;align-items:baseline;gap:8px;background:var(--c,var(--badge));color:#161A22;
    border-radius:3px;padding:5px 11px;margin:0 6px 6px 0;font-size:13px;font-weight:700}
  #qzHits .hit i{font-style:normal;font-family:var(--mono);font-size:10.5px;opacity:.6}
  #qzErr{color:#E0574A;font-size:12px;margin-top:9px;min-height:1px;line-height:1.5}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="tnote">
  <span class="dot"></span>
  <div class="body">
    <span class="lab">운영 담당자 안내</span>
    <p id="tnoteText"></p>
  </div>
</div>

<header>
  <div class="brand">
    <span class="live" id="live"></span>
    <div style="min-width:0">
      <span class="eyebrow">Q &amp; A</span>
      <h1 id="pgm">연결하는 중</h1>
    </div>
  </div>
  <div class="meters">
    <div class="gauge">
      <div class="cell"><span>출석</span><b id="mAll">0</b></div>
      <div class="cell q"><span>질문</span><b id="mQ">0</b></div>
    </div>
    <div class="zoom">
      <button id="zOut" title="글자 작게" aria-label="글자 작게">A−</button>
      <button id="zIn" title="글자 크게" aria-label="글자 크게">A＋</button>
      <button id="ordBtn" title="새 질문이 쌓이는 방향" style="width:auto;padding:0 12px">↓ 최신 아래</button>
    </div>
  </div>
</header>

<div id="flash">질문이 등록되었습니다</div>

<button id="qzBtn">돌발퀴즈</button>
<div id="qzPanel">
  <h3>돌발퀴즈</h3>
  <div class="d">문제는 말로 내고, 여기엔 정답만 넣으세요. 여러 개면 쉼표로 구분합니다.
참가자에게는 정답이 전달되지 않고, 이 화면이 판정합니다.</div>
  <input type="text" id="qzAns" placeholder="예: 안전, safety, 세이프티" maxlength="120" autocomplete="off" />
  <div class="qzmode">
    <button id="qzContains" class="on">포함되면 정답</button>
    <button id="qzExact">정확히 일치</button>
  </div>
  <button id="qzGo">시작</button>
  <div id="qzErr"></div>
  <div id="qzHits"></div>
</div>

<div class="wrap">
  <main id="scroller"><div id="board"></div></main>
  <div id="note">
    <div class="big" id="noteBig">질문을 기다리는 중입니다</div>
    <div class="sub" id="noteSub">참가자가 질문을 보내면 이 화면에 바로 올라옵니다.</div>
  </div>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyAQpfOww8oxF3mYN_vRiRFYmKIdVf0uXU4",
  authDomain: "studyclass-a03b4.firebaseapp.com",
  databaseURL: "https://studyclass-a03b4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "studyclass-a03b4",
  storageBucket: "studyclass-a03b4.firebasestorage.app",
  messagingSenderId: "333180992793",
  appId: "1:333180992793:web:342826b1a83e54b1ddd988"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, goOffline, goOnline, ref, set, update, get, onValue, query, orderByChild, limitToLast,
         onChildAdded, onChildChanged, onChildRemoved } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

const $ = s => document.querySelector(s);
const board = $('#board'), scroller = $('#scroller'), note = $('#note');
const cards = new Map();          // 메시지키 → DOM 요소
const syncCount = () => document.querySelector('#mQ').textContent =
  String([...cards.values()].filter(n => !n.dataset.quiz).length);
let sid, attached = null, offs = [];   // 현재 세션 / 실제로 리스너를 건 세션
let quiz = { on:false }, quizMode = 'contains', quizHits = {}, judged = new Set();
let clearAt = 0, primeUntil = 0;       // 화면 정리 기준 시각 / 첫 로딩 알림 억제
let order = new Map();                 // 사번 → 입장 순번 (색 배정 기준)

/* ── 사람별 색 ──
   입장 순서대로 색환을 황금각(137.5°)만큼 돌며 나눈다.
   인원이 몇이든 그때까지의 색이 가장 넓게 벌어지고,
   사람이 늘어도 이미 받은 색은 바뀌지 않는다. */
const ANON_C = '#98A1B0';              // 익명은 사람색을 주지 않는다 (색으로 신원이 드러나므로)
function hue2color(i){
  const h = (i * 137.508) % 360;
  const step = i % 3;
  let sat = [68, 60, 76][step], lig = [73, 68, 80][step];   // 빔프로젝터 가독성 기준(대비 5.4:1 이상)
  if (h > 200 && h < 285) lig += 9;    // 파랑·보라 계열은 어두워 보여 밝게 보정
  if (h > 45  && h < 70)  lig -= 6;    // 노랑 계열은 튀어서 조금 낮춤
  return `hsl(${h.toFixed(1)} ${sat}% ${lig}%)`;
}
function fallbackIdx(no){              // 출석부가 아직 안 왔을 때 임시 배정
  let h = 0;
  for (const ch of String(no||'')) h = (h * 31 + ch.charCodeAt(0)) % 997;
  return h;
}
function colorOf(no, isAnon){
  if (isAnon) return ANON_C;
  return hue2color(order.has(no) ? order.get(no) : fallbackIdx(no));
}
function repaintColors(){
  for (const node of cards.values()){
    node.style.setProperty('--c', colorOf(node.dataset.no, node.dataset.anon === '1'));
  }
}

/* ── 새 질문이 쌓이는 방향 (기본: 아래로) ── */
let newestBottom = localStorage.getItem('qa_order') !== 'top';
const orderBtn = $('#ordBtn');
function paintOrderBtn(){ orderBtn.textContent = newestBottom ? '↓ 최신 아래' : '↑ 최신 위'; }
function scrollNewest(){
  const to = newestBottom ? scroller.scrollHeight : 0;
  try { scroller.scrollTo({ top: to, behavior: 'smooth' }); } catch { scroller.scrollTop = to; }
}
orderBtn.onclick = () => {
  newestBottom = !newestBottom;
  localStorage.setItem('qa_order', newestBottom ? 'bottom' : 'top');
  [...board.children].reverse().forEach(n => board.append(n));   // 있는 카드 순서를 뒤집는다
  paintOrderBtn(); scrollNewest();
};
paintOrderBtn();

/* ── 글자 크기 ── */
let qs = parseFloat(localStorage.getItem('qa_zoom') || '1');
const applyZoom = () => { document.documentElement.style.setProperty('--qs', qs.toFixed(2)); localStorage.setItem('qa_zoom', qs); };
$('#zIn').onclick  = () => { qs = Math.min(1.8, qs + 0.1); applyZoom(); };
$('#zOut').onclick = () => { qs = Math.max(0.8, qs - 0.1); applyZoom(); };
applyZoom();

/* ── 도우미 ── */
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const hhmm = ts => { const d = new Date(ts || Date.now()); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const showNote = (big, sub, fin) => {
  $('#noteBig').textContent = big; $('#noteSub').textContent = sub;
  const old = note.querySelector('.fin'); if (old) old.remove();
  if (fin){
    const box = el('div','fin');
    [['참여', fin.ppl||0, '명'], ['질문', fin.q||0, '개']].forEach(([lab,v]) => {
      const d = el('div'); d.append(el('b',null,String(v)), el('span',null,lab)); box.append(d);
    });
    note.append(box);
  }
  note.classList.add('show');
};
const hideNote = () => note.classList.remove('show');

function paint(node, m){
  node.classList.toggle('done', !!m.done);
  node.dataset.anon = m.anon ? '1' : '';
  node.style.setProperty('--c', colorOf(m.empNo || node.dataset.no, m.anon));
  node.querySelector('.nm').textContent  = m.anon ? '익명' : (m.name || '이름 없음');
  node.querySelector('.aff').textContent = m.anon ? '' : [m.position, m.dept].filter(Boolean).join(' · ');
  node.querySelector('time').textContent = hhmm(m.ts);
  node.querySelector('p').textContent    = m.text || '';
}

function addCard(key, m, v){
  if (m.hide || (m.ts || 0) <= clearAt) return;
  if (m.quizRound && !v) return;                    // 문답모드가 아닐 때의 지난 답안은 띄우지 않는다
  const node = el('article','q' + (v ? ' ans ' + (v.ok ? 'ok' : 'no') : ''));
  node.dataset.ts = m.ts || 0;
  node.dataset.no = m.empNo || '';
  node.dataset.anon = m.anon ? '1' : '';
  if (v) node.dataset.quiz = '1';
  node.style.setProperty('--c', colorOf(m.empNo, m.anon));
  const tag = el('span','tag');
  tag.append(el('span','nm'), el('span','aff'));
  node.append(tag, el('p'), el('time'));
  if (v){
    const mk = el('div','mark');
    if (v.ok && v.rank) mk.append(el('span','rk', String(v.rank)));
    mk.append(el('span','st', v.ok ? '✓' : '✕'));
    node.append(mk);
  }
  paint(node, m);
  if (newestBottom) board.append(node); else board.prepend(node);
  cards.set(key, node);
  node.classList.add('fresh');
  setTimeout(() => node.classList.remove('fresh'), 9000);
  syncCount(); hideNote();
  if (!v && Date.now() > primeUntil) flash();       // 답안이 올라올 때마다 알림을 띄우지는 않는다
  scrollNewest();
}

let flashT;
function flash(){
  const f = $('#flash');
  f.classList.add('on');
  clearTimeout(flashT);
  flashT = setTimeout(() => f.classList.remove('on'), 2400);
}

/* 관리자가 '질문 화면 정리'를 누르면 그 시각 이전 질문을 화면에서 내린다 (기록은 그대로) */
function applyClear(at){
  clearAt = at || 0;
  for (const [key, node] of [...cards]){
    if ((+node.dataset.ts || 0) <= clearAt){ node.remove(); cards.delete(key); }
  }
  syncCount();
  if (!cards.size) showNote('질문을 기다리는 중입니다','참가자가 질문을 보내면 이 화면에 바로 올라옵니다.');
}

function dropCard(key){
  const n = cards.get(key);
  if (n){ n.remove(); cards.delete(key); syncCount(); }
  if (!cards.size) showNote('질문을 기다리는 중입니다','참가자가 질문을 보내면 이 화면에 바로 올라옵니다.');
}

function clearAll(){
  offs.forEach(f => f()); offs = [];
  board.innerHTML = ''; cards.clear();
  $('#mAll').textContent = '0'; $('#mQ').textContent = '0';
}

/* ── 세션 붙이기 ── */
function attach(newSid, ended){
  if (newSid !== sid){ sid = newSid; clearAll(); }

  if (!sid){
    if (attached !== null){ offs.forEach(f=>f()); offs=[]; attached=null; }
    $('#live').classList.remove('on');
    if (ended && ended.name){
      $('#pgm').textContent = ended.name;
      showNote(`〈${ended.name}〉 과정이 끝났습니다`, '수고하셨습니다.', ended);
    } else {
      showNote('다음 과정을 기다리는 중입니다', '관리자 화면에서 과정을 진행하면 이 화면이 켜집니다.');
    }
    return;
  }
  if (attached === sid) return;
  attached = sid; clearAt = 0; order = new Map(); primeUntil = Date.now() + 2000;
  quiz = { on:false }; quizHits = {}; judged = new Set(); paintQuiz();
  $('#tnote').classList.remove('on'); $('#tnoteText').textContent = '';   // 첫 로딩 때는 알림 억제
  $('#live').classList.add('on');
  showNote('질문을 기다리는 중입니다','참가자가 질문을 보내면 이 화면에 바로 올라옵니다.');

  const qRef = query(ref(db, `msg/${sid}`), orderByChild('ts'), limitToLast(200));
  offs.push(onChildAdded(qRef, s => { const m = s.val(); addCard(s.key, m, judge(s.key, m)); }));
  offs.push(onChildChanged(qRef, s => {
    const m = s.val(), n = cards.get(s.key);
    if (m.hide){ dropCard(s.key); return; }
    if (n) paint(n, m); else addCard(s.key, m);
  }));
  offs.push(onChildRemoved(qRef, s => dropCard(s.key)));

  offs.push(onValue(ref(db, `attend/${sid}`), s => {
    const v = s.val() || {};
    $('#mAll').textContent = String(Object.keys(v).length);
    // joinedAt이 아직 안 찍힌 사람은 맨 뒤로 — 기존 사람의 순번이 밀리지 않게
    const jt = r => (r && r.joinedAt) ? r.joinedAt : Number.MAX_SAFE_INTEGER;
    order = new Map(Object.entries(v)
      .sort((a,b) => jt(a[1]) - jt(b[1]) || String(a[0]).localeCompare(String(b[0])))
      .map(([no], i) => [no, i]));
    repaintColors();
  }));
  offs.push(onValue(ref(db, `sessions/${sid}/screenClearAt`), s => applyClear(s.val() || 0)));
  offs.push(onValue(ref(db, `quiz/${sid}`), s => {
    const prev = quiz.round;
    quiz = s.val() || { on:false };
    if (quiz.round !== prev) judged = new Set(Object.keys(quizHits[quiz.round] || {}));
    paintQuiz();
  }));
  offs.push(onValue(ref(db, `quizHit/${sid}`), s => { quizHits = s.val() || {}; paintHits(); }));
  offs.push(onValue(ref(db, `teachNote/${sid}`), s => {
    const n = s.val();
    $('#tnoteText').textContent = (n && n.text) || '';
    $('#tnote').classList.toggle('on', !!(n && n.text));
  }));
}

/* ══════════ 돌발퀴즈 ══════════
   정답은 이 화면과 데이터베이스에만 있고 참가자에게는 내려가지 않는다.
   들어온 답을 판정하는 것도 이 화면이 한다. */
const norm = t => String(t||'').toLowerCase().replace(/\s+/g,'');

function judge(key, m){
  if (!quiz.on || !m || m.quizRound !== quiz.round) return null;
  const got = norm(m.text);
  const list = (quiz.answers || []).map(norm).filter(Boolean);
  const hit = list.some(a => quiz.mode === 'exact' ? got === a : got.includes(a));
  if (!hit) return { ok:false };                     // 오답도 강사가 봐야 하므로 결과를 돌려준다

  const already = judged.has(m.empNo) || !!(quizHits[quiz.round] || {})[m.empNo];
  if (already){ judged.add(m.empNo); return { ok:true, rank:0 }; }
  judged.add(m.empNo);
  const rank = Math.max(judged.size, Object.keys(quizHits[quiz.round] || {}).length + 1);
  set(ref(db, `quizHit/${sid}/${quiz.round}/${m.empNo}`), {
    name: m.name || '', position: m.position || '', dept: m.dept || '',
    text: m.text || '', at: Date.now(), rank, quizAnswer: (quiz.answers || []).join(', ')
  }).catch(() => judged.delete(m.empNo));
  return { ok:true, rank };
}

const qzPanel = $('#qzPanel'), qzBtn = $('#qzBtn');
$('#qzContains').onclick = () => { quizMode = 'contains'; paintMode(); };
$('#qzExact').onclick    = () => { quizMode = 'exact';    paintMode(); };
function paintMode(){
  $('#qzContains').classList.toggle('on', quizMode === 'contains');
  $('#qzExact').classList.toggle('on', quizMode === 'exact');
}
qzBtn.onclick = () => {
  if (quiz.on){ stopQuiz(); return; }
  qzPanel.classList.toggle('on');
  if (qzPanel.classList.contains('on')) setTimeout(() => $('#qzAns').focus(), 60);
};
$('#qzAns').addEventListener('keydown', e => { if (e.key === 'Enter') $('#qzGo').click(); });

$('#qzGo').onclick = async () => {
  if (quiz.on){ stopQuiz(); return; }
  const raw = $('#qzAns').value.trim();
  const answers = raw.split(',').map(x => x.trim()).filter(Boolean);
  if (!answers.length){ $('#qzErr').textContent = '정답을 입력하세요.'; return; }
  const shortest = Math.min(...answers.map(a => norm(a).length));
  if (quizMode === 'contains' && shortest <= 1){
    $('#qzErr').textContent = '정답이 한 글자면 다른 답에도 섞여 들어갑니다. ‘정확히 일치’로 바꾸거나 답을 늘려 주세요.';
    return;
  }
  $('#qzErr').textContent = '';
  const round = (quiz.round || 0) + 1;
  judged = new Set();
  try{
    await set(ref(db, `quiz/${sid}`), { on:true, answers, mode:quizMode, round, startedAt: Date.now() });
    await set(ref(db, `live/${sid}`), { quizOn:true, quizRound:round });
  } catch(e){ $('#qzErr').textContent = '시작하지 못했습니다. (' + (e.code||e.message) + ')'; }
};
async function stopQuiz(){
  try{
    await update(ref(db, `quiz/${sid}`), { on:false });
    await update(ref(db, `live/${sid}`), { quizOn:false });
  } catch(e){ $('#qzErr').textContent = '끄지 못했습니다. (' + (e.code||e.message) + ')'; }
}
function paintQuiz(){
  const on = !!quiz.on;
  qzBtn.textContent = on ? '문답모드 끄기' : '돌발퀴즈';
  qzBtn.classList.toggle('live', on);
  $('#qzGo').textContent = on ? '문답모드 끄기' : '시작';
  $('#qzGo').classList.toggle('stop', on);
  $('#qzAns').disabled = on;
  if (on){
    qzPanel.classList.add('on');
    $('#qzAns').value = (quiz.answers || []).join(', ');
    quizMode = quiz.mode || 'contains'; paintMode();
  } else {
    $('#qzAns').value = '';
  }
  paintHits();
}
function paintHits(){
  const box = $('#qzHits'); box.innerHTML = '';
  const r = quiz.round;
  if (!r || !quiz.on) return;
  const people = Object.entries(quizHits[r] || {}).sort((a,b)=>(a[1].at||0)-(b[1].at||0));
  box.append(el('div','hd', `${r}회차 · 정답 ${people.length}명`));
  people.forEach(([no, h], i) => {
    const chip = el('span','hit');
    chip.style.setProperty('--c', colorOf(no, false));
    chip.append(document.createTextNode(h.name || '이름 없음'), el('i', null, String(i+1)));
    box.append(chip);
  });
}

/* ── 시작 ── */
function start(){
  onValue(ref(db, '.info/connected'), s => { __net = s.val() === true; $('#live').classList.toggle('off', !__net); });

  onValue(ref(db, 'config'), s => {
    const c = s.val() || {};
    const nm = c.programName || '이름 없는 과정';
    $('#pgm').textContent = nm;
    document.title = nm + ' · 강사용';
    attach(c.sessionId || null, c.lastEnded || null);
  });
}
let started = false;
onAuthStateChanged(auth, u => {
  if (!u){ signInAnonymously(auth).catch(e =>
    showNote('접속하지 못했습니다', 'Firebase 익명 로그인이 켜져 있는지 확인해 주세요. (' + (e.code||e.message) + ')')); return; }
  if (!started){ started = true; start(); }
});
</script>
