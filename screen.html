<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>질문 화면 · 강사용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root{
    --bg:#141821;
    --card:#1D2330;
    --card2:#232A39;
    --line:#2E3646;
    --ink:#EEF0F3;
    --muted:#8D96A8;
    --badge:#F2C14E;      /* 명찰 색 — 이 화면의 유일한 강조색 */
    --ok:#5FBF9B;
    --qs:1;               /* 질문 글자 배율 (A- / A+ 로 조절) */
    --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;
    --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ── 상단 바 ── */
  header{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    gap:20px;padding:16px 26px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#181D28,#141821);
  }
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .live{width:9px;height:9px;border-radius:50%;background:#4A5468;flex:0 0 auto}
  .live.off{background:#C05B4A!important;animation:none!important}
  .live.on{background:var(--ok);box-shadow:0 0 0 0 rgba(95,191,155,.55);animation:pulse 2.4s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 12px rgba(95,191,155,0)}100%{box-shadow:0 0 0 0 rgba(95,191,155,0)}}
  .brand h1{font-size:22px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:3px}

  .meters{display:flex;align-items:center;gap:26px;flex:0 0 auto}
  .meter{text-align:right;line-height:1.1}
  .meter b{display:block;font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
  .meter span{font-size:11px;color:var(--muted);letter-spacing:.05em}
  .meter.q b{color:var(--badge)}

  .zoom{display:flex;gap:6px;margin-left:6px}
  .zoom button{
    width:38px;height:34px;border:1px solid var(--line);background:var(--card);color:var(--muted);
    border-radius:8px;font-family:var(--mono);font-size:13px;cursor:pointer;transition:.15s;
  }
  .zoom button:hover{color:var(--ink);border-color:#3E4A5E}
  .zoom button:focus-visible{outline:2px solid var(--badge);outline-offset:2px}

  /* ── 질문 보드 ── */
  main{flex:1 1 auto;overflow-y:auto;padding:22px 26px 60px}
  /* 질문은 한 칸으로 세로로만 쌓는다. 가로로 너무 길면 읽기 힘드니 폭을 묶고 가운데 정렬 */
  #board{display:flex;flex-direction:column;gap:14px;max-width:1150px;margin:0 auto;width:100%}

  .q{
    flex:0 0 auto;
    position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 20px 18px 24px;overflow:hidden;animation:in .38s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
  .q::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--badge))}

  /* 명찰 — 이 앱의 시그니처 */
  .tag{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:11px}
  .tag .nm{font-size:calc(19px * var(--qs));font-weight:700;color:var(--c,var(--badge));letter-spacing:-.01em}
  .tag .aff{font-size:calc(13px * var(--qs));color:var(--muted)}
  .tag time{margin-left:auto;font-family:var(--mono);font-size:12px;color:#697488;flex:0 0 auto}

  .q p{font-size:calc(19px * var(--qs));line-height:1.62;white-space:pre-wrap;word-break:break-word}

  .q.fresh{border-color:var(--c,var(--badge));box-shadow:0 0 0 1px rgba(255,255,255,.10),0 12px 34px -14px rgba(0,0,0,.7)}
  .q.done{opacity:.42}
  .q.done::before{background:#3E4A5E}
  .q.done .tag .nm{color:var(--muted)}
  .q.done .tag::after{content:'답변함';font-family:var(--mono);font-size:11px;color:var(--ok);border:1px solid rgba(95,191,155,.4);border-radius:5px;padding:1px 6px}

  /* ── 빈 화면 / 안내 ── */
  #note{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:40px;pointer-events:none;
  }
  #note.show{display:flex}
  #note .big{font-size:24px;font-weight:600;color:#5B6578}
  #note .sub{font-size:15px;color:#48505F;line-height:1.8;white-space:pre-line}
  #note .fin{display:flex;gap:26px;margin-top:6px}
  #note .fin div{text-align:center}
  #note .fin b{display:block;font-family:var(--mono);font-size:30px;font-weight:600;color:var(--badge)}
  #note .fin span{font-size:12px;color:#5B6578}
  .wrap{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}

  /* 새 질문 알림 */
  #flash{
    position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-140%);
    background:var(--badge);color:#20242E;font-weight:700;font-size:17px;letter-spacing:-.01em;
    padding:13px 30px;border-radius:0 0 14px 14px;box-shadow:0 12px 34px -10px rgba(0,0,0,.55);
    transition:transform .34s cubic-bezier(.2,.85,.3,1);z-index:40;white-space:nowrap;
  }
  #flash.on{transform:translateX(-50%) translateY(0)}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="live" id="live"></span>
    <div style="min-width:0">
      <span class="eyebrow">Q &amp; A</span>
      <h1 id="pgm">연결하는 중</h1>
    </div>
  </div>
  <div class="meters">
    <div class="meter"><b id="mAll">0</b><span>출석</span></div>
    <div class="meter q"><b id="mQ">0</b><span>질문</span></div>
    <div class="zoom">
      <button id="zOut" title="글자 작게" aria-label="글자 작게">A−</button>
      <button id="zIn" title="글자 크게" aria-label="글자 크게">A＋</button>
      <button id="ordBtn" title="새 질문이 쌓이는 방향" style="width:auto;padding:0 12px">↓ 최신 아래</button>
    </div>
  </div>
</header>

<div id="flash">질문이 등록되었습니다</div>

<div class="wrap">
  <main id="scroller"><div id="board"></div></main>
  <div id="note">
    <div class="big" id="noteBig">질문을 기다리는 중입니다</div>
    <div class="sub" id="noteSub">참가자가 질문을 보내면 이 화면에 바로 올라옵니다.</div>
  </div>
</div>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyAQpfOww8oxF3mYN_vRiRFYmKIdVf0uXU4",
  authDomain: "studyclass-a03b4.firebaseapp.com",
  databaseURL: "https://studyclass-a03b4-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "studyclass-a03b4",
  storageBucket: "studyclass-a03b4.firebasestorage.app",
  messagingSenderId: "333180992793",
  appId: "1:333180992793:web:342826b1a83e54b1ddd988"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, goOffline, goOnline, ref, onValue, query, orderByChild, limitToLast,
         onChildAdded, onChildChanged, onChildRemoved } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

const $ = s => document.querySelector(s);
const board = $('#board'), scroller = $('#scroller'), note = $('#note');
const cards = new Map();          // 메시지키 → DOM 요소
const syncCount = () => document.querySelector('#mQ').textContent = String(cards.size);
let sid, attached = null, offs = [];   // 현재 세션 / 실제로 리스너를 건 세션
let clearAt = 0, primeUntil = 0;       // 화면 정리 기준 시각 / 첫 로딩 알림 억제
let order = new Map();                 // 사번 → 입장 순번 (색 배정 기준)

/* ── 사람별 색 ──
   입장 순서대로 색환을 황금각(137.5°)만큼 돌며 나눈다.
   인원이 몇이든 그때까지의 색이 가장 넓게 벌어지고,
   사람이 늘어도 이미 받은 색은 바뀌지 않는다. */
const ANON_C = '#98A1B0';              // 익명은 사람색을 주지 않는다 (색으로 신원이 드러나므로)
function hue2color(i){
  const h = (i * 137.508) % 360;
  const step = i % 3;
  let sat = [68, 60, 76][step], lig = [73, 68, 80][step];   // 빔프로젝터 가독성 기준(대비 5.4:1 이상)
  if (h > 200 && h < 285) lig += 9;    // 파랑·보라 계열은 어두워 보여 밝게 보정
  if (h > 45  && h < 70)  lig -= 6;    // 노랑 계열은 튀어서 조금 낮춤
  return `hsl(${h.toFixed(1)} ${sat}% ${lig}%)`;
}
function fallbackIdx(no){              // 출석부가 아직 안 왔을 때 임시 배정
  let h = 0;
  for (const ch of String(no||'')) h = (h * 31 + ch.charCodeAt(0)) % 997;
  return h;
}
function colorOf(no, isAnon){
  if (isAnon) return ANON_C;
  return hue2color(order.has(no) ? order.get(no) : fallbackIdx(no));
}
function repaintColors(){
  for (const node of cards.values()){
    node.style.setProperty('--c', colorOf(node.dataset.no, node.dataset.anon === '1'));
  }
}

/* ── 새 질문이 쌓이는 방향 (기본: 아래로) ── */
let newestBottom = localStorage.getItem('qa_order') !== 'top';
const orderBtn = $('#ordBtn');
function paintOrderBtn(){ orderBtn.textContent = newestBottom ? '↓ 최신 아래' : '↑ 최신 위'; }
function scrollNewest(){
  const to = newestBottom ? scroller.scrollHeight : 0;
  try { scroller.scrollTo({ top: to, behavior: 'smooth' }); } catch { scroller.scrollTop = to; }
}
orderBtn.onclick = () => {
  newestBottom = !newestBottom;
  localStorage.setItem('qa_order', newestBottom ? 'bottom' : 'top');
  [...board.children].reverse().forEach(n => board.append(n));   // 있는 카드 순서를 뒤집는다
  paintOrderBtn(); scrollNewest();
};
paintOrderBtn();

/* ── 글자 크기 ── */
let qs = parseFloat(localStorage.getItem('qa_zoom') || '1');
const applyZoom = () => { document.documentElement.style.setProperty('--qs', qs.toFixed(2)); localStorage.setItem('qa_zoom', qs); };
$('#zIn').onclick  = () => { qs = Math.min(1.8, qs + 0.1); applyZoom(); };
$('#zOut').onclick = () => { qs = Math.max(0.8, qs - 0.1); applyZoom(); };
applyZoom();

/* ── 도우미 ── */
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const hhmm = ts => { const d = new Date(ts || Date.now()); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const showNote = (big, sub, fin) => {
  $('#noteBig').textContent = big; $('#noteSub').textContent = sub;
  const old = note.querySelector('.fin'); if (old) old.remove();
  if (fin){
    const box = el('div','fin');
    [['참여', fin.ppl||0, '명'], ['질문', fin.q||0, '개']].forEach(([lab,v]) => {
      const d = el('div'); d.append(el('b',null,String(v)), el('span',null,lab)); box.append(d);
    });
    note.append(box);
  }
  note.classList.add('show');
};
const hideNote = () => note.classList.remove('show');

function paint(node, m){
  node.classList.toggle('done', !!m.done);
  node.dataset.anon = m.anon ? '1' : '';
  node.style.setProperty('--c', colorOf(m.empNo || node.dataset.no, m.anon));
  node.querySelector('.nm').textContent  = m.anon ? '익명' : (m.name || '이름 없음');
  node.querySelector('.aff').textContent = m.anon ? '' : [m.position, m.dept].filter(Boolean).join(' · ');
  node.querySelector('time').textContent = hhmm(m.ts);
  node.querySelector('p').textContent    = m.text || '';
}

function addCard(key, m){
  if (m.hide || (m.ts || 0) <= clearAt) return;
  const node = el('article','q');
  node.dataset.ts = m.ts || 0;
  node.dataset.no = m.empNo || '';
  node.dataset.anon = m.anon ? '1' : '';
  node.style.setProperty('--c', colorOf(m.empNo, m.anon));
  const tag  = el('div','tag');
  tag.append(el('span','nm'), el('span','aff'), el('time'));
  node.append(tag, el('p'));
  paint(node, m);
  if (newestBottom) board.append(node); else board.prepend(node);
  cards.set(key, node);
  node.classList.add('fresh');
  setTimeout(() => node.classList.remove('fresh'), 9000);
  syncCount(); hideNote();
  if (Date.now() > primeUntil) flash();
  scrollNewest();
}

let flashT;
function flash(){
  const f = $('#flash');
  f.classList.add('on');
  clearTimeout(flashT);
  flashT = setTimeout(() => f.classList.remove('on'), 2400);
}

/* 관리자가 '질문 화면 정리'를 누르면 그 시각 이전 질문을 화면에서 내린다 (기록은 그대로) */
function applyClear(at){
  clearAt = at || 0;
  for (const [key, node] of [...cards]){
    if ((+node.dataset.ts || 0) <= clearAt){ node.remove(); cards.delete(key); }
  }
  syncCount();
  if (!cards.size) showNote('질문을 기다리는 중입니다','참가자가 질문을 보내면 이 화면에 바로 올라옵니다.');
}

function dropCard(key){
  const n = cards.get(key);
  if (n){ n.remove(); cards.delete(key); syncCount(); }
  if (!cards.size) showNote('질문을 기다리는 중입니다','참가자가 질문을 보내면 이 화면에 바로 올라옵니다.');
}

function clearAll(){
  offs.forEach(f => f()); offs = [];
  board.innerHTML = ''; cards.clear();
  $('#mAll').textContent = '0'; $('#mQ').textContent = '0';
}

/* ── 세션 붙이기 ── */
function attach(newSid, ended){
  if (newSid !== sid){ sid = newSid; clearAll(); }

  if (!sid){
    if (attached !== null){ offs.forEach(f=>f()); offs=[]; attached=null; }
    $('#live').classList.remove('on');
    if (ended && ended.name){
      $('#pgm').textContent = ended.name;
      showNote(`〈${ended.name}〉 과정이 끝났습니다`, '수고하셨습니다.', ended);
    } else {
      showNote('다음 과정을 기다리는 중입니다', '관리자 화면에서 과정을 진행하면 이 화면이 켜집니다.');
    }
    return;
  }
  if (attached === sid) return;
  attached = sid; clearAt = 0; order = new Map(); primeUntil = Date.now() + 2000;   // 첫 로딩 때는 알림 억제
  $('#live').classList.add('on');
  showNote('질문을 기다리는 중입니다','참가자가 질문을 보내면 이 화면에 바로 올라옵니다.');

  const qRef = query(ref(db, `msg/${sid}`), orderByChild('ts'), limitToLast(200));
  offs.push(onChildAdded(qRef, s => addCard(s.key, s.val())));
  offs.push(onChildChanged(qRef, s => {
    const m = s.val(), n = cards.get(s.key);
    if (m.hide){ dropCard(s.key); return; }
    if (n) paint(n, m); else addCard(s.key, m);
  }));
  offs.push(onChildRemoved(qRef, s => dropCard(s.key)));

  offs.push(onValue(ref(db, `attend/${sid}`), s => {
    const v = s.val() || {};
    $('#mAll').textContent = String(Object.keys(v).length);
    // joinedAt이 아직 안 찍힌 사람은 맨 뒤로 — 기존 사람의 순번이 밀리지 않게
    const jt = r => (r && r.joinedAt) ? r.joinedAt : Number.MAX_SAFE_INTEGER;
    order = new Map(Object.entries(v)
      .sort((a,b) => jt(a[1]) - jt(b[1]) || String(a[0]).localeCompare(String(b[0])))
      .map(([no], i) => [no, i]));
    repaintColors();
  }));
  offs.push(onValue(ref(db, `sessions/${sid}/screenClearAt`), s => applyClear(s.val() || 0)));
}

/* ── 시작 ── */
signInAnonymously(auth).then(() => {
  onValue(ref(db, '.info/connected'), s => { __net = s.val() === true; $('#live').classList.toggle('off', !__net); });

  onValue(ref(db, 'config'), s => {
    const c = s.val() || {};
    const nm = c.programName || '이름 없는 과정';
    $('#pgm').textContent = nm;
    document.title = nm + ' · 강사용';
    attach(c.sessionId || null, c.lastEnded || null);
  });
}).catch(e => {
  showNote('접속하지 못했습니다', 'Firebase 익명 로그인이 켜져 있는지 확인해 주세요. (' + (e.code || e.message) + ')');
});
</script>
</body>
</html>
